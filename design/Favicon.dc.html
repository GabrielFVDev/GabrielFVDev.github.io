<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Favicon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 512px; height: 512px; box-sizing: border-box; background: #111113; border-radius: 112px; display: flex; align-items: center; justify-content: center; font-family: 'Inter Tight', system-ui, sans-serif;">
<span style="color: #FFFFFF; font-size: 360px; font-weight: 700; letter-spacing: -0.06em; line-height: 1; transform: translateY(-34px);">g<span style="color: {{accent}}">.</span></span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2544F5","options":["#2544F5","#E4381B","#6D28D9","#0F766E"]},"$preview":{"width":512,"height":512}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#2544F5' };
}
}
</script>
</body>
</html>
