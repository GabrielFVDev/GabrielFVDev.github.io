<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gabriel Vasconcelos · Desenvolvedor Mobile</title>
    <meta
      name="description"
      content="Desenvolvedor mobile em São Paulo. Apps com Flutter e Kotlin, APIs com Spring Boot."
    />
    <meta name="theme-color" content="#F5F5F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0B0D" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gabrielfvdev.github.io/" />
    <meta property="og:title" content="Gabriel Vasconcelos · Desenvolvedor Mobile" />
    <meta property="og:description" content="Apps com Flutter e Kotlin, APIs com Spring Boot." />
    <meta property="og:image" content="https://gabrielfvdev.github.io/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Fontes do próprio site: baixadas junto com o HTML, sem esperar o CSS de outro servidor -->
    <link rel="preload" href="/fonts/inter-tight-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/geist-mono-latin-wght.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Tema e idioma decididos antes da pintura, para não piscar a versão errada.
         Primeira visita: segue o sistema e o idioma do navegador. Depois, lembra a escolha. -->
    <script>
      ;(function () {
        var root = document.documentElement
        var theme, lang
        try {
          theme = localStorage.getItem('gv-theme')
          lang = localStorage.getItem('gv-lang')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        if (lang !== 'pt' && lang !== 'en') {
          lang = /^pt/i.test(navigator.language || '') ? 'pt' : 'en'
        }
        root.dataset.theme = theme
        root.lang = lang === 'en' ? 'en' : 'pt-BR'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
